<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOVA AI</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">
            <span>✦</span> NOVA
        </div>

        <button class="new-chat" onclick="newChat()">
            + New Chat
        </button>
    </header>

    <main class="app">

        <section class="welcome" id="welcome">
            <div class="nova-icon">✦</div>

            <h1>Hello, I'm <span>NOVA</span>.</h1>

            <p>
                Your intelligent AI workspace for thinking,
                creating, researching and building.
            </p>

            <div class="quick-actions">
                <button onclick="usePrompt('Explain something to me simply')">
                    🧠 Explain
                </button>

                <button onclick="usePrompt('Give me creative ideas')">
                    💡 Create
                </button>

                <button onclick="usePrompt('Help me write something')">
                    ✍️ Write
                </button>

                <button onclick="usePrompt('Help me build a website')">
                    💻 Build
                </button>
            </div>
        </section>

        <section class="chat" id="chat"></section>

        <div class="input-area">

            <div class="input-box">

                <button class="attach" title="Attach file">
                    +
                </button>

                <textarea
                    id="prompt"
                    placeholder="Ask NOVA anything..."
                    rows="1"
                    onkeydown="handleEnter(event)"
                ></textarea>

                <button class="send" onclick="sendMessage()">
                    ↑
                </button>

            </div>

            <p class="disclaimer">
                NOVA can make mistakes. Check important information.
            </p>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
