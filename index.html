<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0d12;
      color: #fff;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
    }

    /* SIDEBAR */
    .sidebar {
      width: 250px;
      background: #11141b;
      border-right: 1px solid #252936;
      padding: 20px 15px;
      display: flex;
      flex-direction: column;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 30px;
    }

    .new-chat {
      width: 100%;
      padding: 13px;
      border: 1px solid #303541;
      border-radius: 12px;
      background: #181c25;
      color: white;
      cursor: pointer;
      margin-bottom: 25px;
      font-size: 15px;
    }

    .new-chat:hover {
      background: #222733;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .menu button {
      background: transparent;
      border: none;
      color: #aeb4c2;
      text-align: left;
      padding: 12px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
    }

    .menu button:hover {
      background: #1a1e27;
      color: white;
    }

    .bottom-menu {
      margin-top: auto;
    }

    /* MAIN */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .topbar {
      height: 65px;
      border-bottom: 1px solid #252936;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 25px;
    }

    .topbar-title {
      font-size: 17px;
      font-weight: 600;
    }

    .profile {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #272d3a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* CHAT */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 35px 20px 150px;
    }

    .welcome {
      max-width: 850px;
      margin: 70px auto 30px;
      text-align: center;
    }

    .welcome h1 {
      font-size: 38px;
      margin-bottom: 12px;
    }

    .welcome p {
      color: #9da4b3;
      font-size: 17px;
    }

    .features {
      max-width: 850px;
      margin: 30px auto;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .feature {
      background: #12161e;
      border: 1px solid #262b36;
      padding: 18px;
      border-radius: 14px;
      cursor: pointer;
      transition: 0.2s;
    }

    .feature:hover {
      background: #191e28;
      transform: translateY(-2px);
    }

    .feature strong {
      display: block;
      margin-bottom: 7px;
    }

    .feature span {
      color: #9299a8;
      font-size: 13px;
    }

    /* MESSAGES */
    .messages {
      max-width: 850px;
      margin: 0 auto;
    }

    .message {
      margin: 15px 0;
      padding: 14px 17px;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user-message {
      background: #202631;
      margin-left: auto;
      max-width: 75%;
    }

    .ai-message {
      background: #131820;
      border: 1px solid #252b36;
      max-width: 85%;
    }

    /* INPUT */
    .input-container {
      position: fixed;
      bottom: 20px;
      left: 250px;
      right: 0;
      display: flex;
      justify-content: center;
      padding: 0 20px;
      pointer-events: none;
    }

    .input-box {
      width: min(850px, 100%);
      background: #171b23;
      border: 1px solid #303642;
      border-radius: 18px;
      display: flex;
      align-items: flex-end;
      padding: 10px;
      pointer-events: auto;
      box-shadow: 0 10px 35px rgba(0,0,0,0.35);
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      padding: 10px;
      font-size: 15px;
      min-height: 45px;
      max-height: 130px;
    }

    textarea::placeholder {
      color: #777f8f;
    }

    .input-button {
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: #aab1bf;
      cursor: pointer;
      font-size: 18px;
    }

    .input-button:hover {
      background: #252b35;
      color: white;
    }

    .send {
      background: white;
      color: black;
      font-weight: bold;
    }

    .send:hover {
      background: #ddd;
      color: black;
    }

    .loading {
      color: #9299a8;
      font-style: italic;
    }

    /* MOBILE */
    @media (max-width: 750px) {
      .sidebar {
        display: none;
      }

      .input-container {
        left: 0;
      }

      .features {
        grid-template-columns: repeat(2, 1fr);
      }

      .welcome h1 {
        font-size: 30px;
      }

      .chat-area {
        padding-top: 20px;
      }

      .user-message,
      .ai-message {
        max-width: 90%;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <div class="logo">NOVA</div>

      <button class="new-chat" onclick="newChat()">
        + New Chat
      </button>

      <div class="menu">
        <button>💬 Chat</button>
        <button>✨ Create</button>
        <button>💻 Code</button>
        <button>🔎 Research</button>
        <button>📁 Files</button>
      </div>

      <div class="menu bottom-menu">
        <button>⚙️ Settings</button>
        <button>❓ Help</button>
      </div>

    </aside>

    <!-- MAIN -->
    <main class="main">

      <header class="topbar">
        <div class="topbar-title">NOVA AI</div>
        <div class="profile">N</div>
      </header>

      <section class="chat-area" id="chatArea">

        <div class="welcome" id="welcome">

          <h1>What can I help you build?</h1>

          <p>
            Ask NOVA anything. Create, code, research and explore.
          </p>

        </div>

        <div class="features" id="features">

          <div class="feature" onclick="usePrompt('Create an image idea for me')">
            <strong>✨ Create</strong>
            <span>Generate ideas and creative content.</span>
          </div>

          <div class="feature" onclick="usePrompt('Help me write some code')">
            <strong>💻 Code</strong>
            <span>Build and debug software.</span>
          </div>

          <div class="feature" onclick="usePrompt('Research this topic for me')">
            <strong>🔎 Research</strong>
            <span>Explore information and explain it.</span>
          </div>

          <div class="feature" onclick="usePrompt('Analyze this for me')">
            <strong>📊 Analyze</strong>
            <span>Understand and break things down.</span>
          </div>

        </div>

        <div class="messages" id="messages"></div>

      </section>

      <!-- INPUT -->
      <div class="input-container">

        <div class="input-box">

          <button class="input-button" title="Attach">
            +
          </button>

          <textarea
            id="messageInput"
            placeholder="Message NOVA..."
            rows="1"
            onkeydown="handleKey(event)"
          ></textarea>

          <button class="input-button" title="Voice">
            🎙
          </button>

          <button
            class="input-button send"
            onclick="sendMessage()"
            title="Send"
          >
            ↑
          </button>

        </div>

      </div>

    </main>

  </div>

  <script>

    const input = document.getElementById("messageInput");
    const messages = document.getElementById("messages");
    const welcome = document.getElementById("welcome");
    const features = document.getElementById("features");
    const chatArea = document.getElementById("chatArea");

    function usePrompt(prompt) {
      input.value = prompt;
      input.focus();
    }

    function handleKey(event) {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    function addMessage(text, type) {

      const message = document.createElement("div");

      message.classList.add("message");

      if (type === "user") {
        message.classList.add("user-message");
      } else {
        message.classList.add("ai-message");
      }

      message.textContent = text;

      messages.appendChild(message);

      chatArea.scrollTop = chatArea.scrollHeight;

      return message;
    }

    async function sendMessage() {

      const message = input.value.trim();

      if (!message) return;

      welcome.style.display = "none";
      features.style.display = "none";

      addMessage(message, "user");

      input.value = "";

      const loading = addMessage("NOVA is thinking...", "ai");
      loading.classList.add("loading");

      try {

        const response = await fetch("/api/chat", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({
            message: message
          })

        });

        const data = await response.json();

        loading.remove();

        if (!response.ok) {

          addMessage(
            "NOVA error: " +
            (data.error || "Something went wrong."),
            "ai"
          );

          return;
        }

        addMessage(
          data.reply || "I couldn't generate a response.",
          "ai"
        );

      } catch (error) {

        loading.remove();

        addMessage(
          "NOVA couldn't connect to the AI server. Check that the backend is running.",
          "ai"
        );

        console.error(error);

      }

    }

    function newChat() {

      messages.innerHTML = "";

      welcome.style.display = "block";
      features.style.display = "grid";

      input.value = "";

      input.focus();

    }

  </script>

</body>
</html>
